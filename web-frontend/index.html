<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Database Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 class="sidebar-title">StudentDB</h1>
            <nav>
                <button class="sidebar-btn" onclick="showView('dashboard')">Dashboard</button>
                <button class="sidebar-btn" onclick="showView('students'); loadStudents();">Students</button>
                <button class="sidebar-btn" onclick="showView('students'); clearForm();">Add Student</button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Dashboard View -->
            <div id="dashboard-view" class="view">
                <h2 class="header-label">Dashboard</h2>
                
                <div class="card-row">
                    <div class="card stat-card">
                        <div class="card-title">Total Students</div>
                        <div class="card-value" id="stat-total-students">0</div>
                    </div>
                    <div class="card stat-card">
                        <div class="card-title">Departments</div>
                        <div class="card-value" id="stat-total-depts">0</div>
                    </div>
                </div>

                <div class="card full-width">
                    <div class="card-title">Department Distribution</div>
                    <div id="stat-dist-container" class="dist-container"></div>
                </div>
            </div>

            <!-- Students View -->
            <div id="students-view" class="view" style="display: none;">
                
                <div class="split-layout">
                    <!-- Table Section -->
                    <div class="table-section">
                        <div class="table-header">
                            <h2 class="header-label">Students List</h2>
                            <input type="text" id="searchInput" placeholder="Search by name, roll, dept..." onkeyup="searchStudents()">
                        </div>
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Roll No</th>
                                        <th>Full Name</th>
                                        <th>Department</th>
                                        <th>CGPA</th>
                                    </tr>
                                </thead>
                                <tbody id="student-table-body">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Form Section -->
                    <div class="card form-section">
                        <div class="card-title">Student Details</div>
                        <form id="student-form" onsubmit="saveStudent(event)">
                            <input type="hidden" id="studentId">
                            
                            <div class="form-group">
                                <label>Roll Number:*</label>
                                <input type="text" id="rollNumber" required>
                            </div>
                            <div class="form-group">
                                <label>Full Name:*</label>
                                <input type="text" id="fullName" required>
                            </div>
                            <div class="form-group">
                                <label>Date of Birth:</label>
                                <input type="date" id="dob">
                            </div>
                            <div class="form-group">
                                <label>Gender:</label>
                                <select id="gender">
                                    <option value="">Select...</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Email:</label>
                                <input type="email" id="email">
                            </div>
                            <div class="form-group">
                                <label>Phone:</label>
                                <input type="text" id="phone">
                            </div>
                            <div class="form-group">
                                <label>Department:*</label>
                                <select id="department" required>
                                    <option value="">Select...</option>
                                    <option value="Computer Science">Computer Science</option>
                                    <option value="Electrical">Electrical</option>
                                    <option value="Mechanical">Mechanical</option>
                                    <option value="Civil">Civil</option>
                                    <option value="Business">Business</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Year (1-5):</label>
                                <input type="number" id="yearOfStudy" min="1" max="5">
                            </div>
                            <div class="form-group">
                                <label>CGPA (0-10):</label>
                                <input type="number" step="0.01" id="cgpa" min="0" max="10">
                            </div>
                            <div class="form-group">
                                <label>Address:</label>
                                <textarea id="address" rows="3"></textarea>
                            </div>

                            <div id="form-status" class="status-msg"></div>

                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
                                <button type="button" class="btn btn-danger" onclick="deleteStudent()">Delete</button>
                                <button type="submit" class="btn btn-primary">Save</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
